name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare demo signing key
        env:
          SIGNING_KEY: ${{ secrets.DEMO_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Zhiyou Demo" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Build and lint Android
        run: gradle -p android assembleRelease lintRelease --no-daemon
      - name: Prepare download
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk zhiyou-0.1.0-android.apk
          sha256sum zhiyou-0.1.0-android.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zhiyou-android
          path: |
            zhiyou-0.1.0-android.apk
            SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'v0.1.0 already published; download this build from Actions artifacts.'
          else
            gh release create v0.1.0 zhiyou-0.1.0-android.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title "织游 v0.1.0 · Android Demo" --notes-file RELEASE_NOTES.md
          fi
