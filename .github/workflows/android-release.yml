name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Domain and mentor service tests
        run: npm test
      - name: Mobile browser tests
        env:
          CHROME_CHANNEL: chromium
        run: |
          npx playwright install chromium --with-deps
          npm run dev -- --host 127.0.0.1 > /tmp/zhiyou-web.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:5173 >/dev/null && break; sleep 1; done
          npm run test:e2e
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore stable demo signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: zhiyou-demo-signing-v2
      - name: Prepare demo signing key
        env:
          SIGNING_KEY: ${{ secrets.DEMO_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
          elif [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Zhiyou Demo" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Build and lint Android
        run: gradle -p android assembleRelease lintRelease --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installed Android WebView smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          heap-size: 256M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle -p android connectedDebugAndroidTest --no-daemon
      - name: Prepare download
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk "zhiyou-$VERSION-android.apk"
          sha256sum "zhiyou-$VERSION-android.apk" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zhiyou-validation-and-apk
          path: |
            zhiyou-*-android.apk
            SHA256SUMS.txt
            test-results/
            android/app/build/reports/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'This version is already published; use Actions artifacts for this build.'
          else
            gh release create "v$VERSION" "zhiyou-$VERSION-android.apk" SHA256SUMS.txt --target "$GITHUB_SHA" --title "织游 v$VERSION · 场景工坊" --notes-file RELEASE_NOTES.md
          fi
