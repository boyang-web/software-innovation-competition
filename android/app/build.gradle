plugins { id 'com.android.application' }
android {
 namespace 'cn.zhiyou.app'
 compileSdk 35
 defaultConfig { applicationId 'cn.zhiyou.app'; minSdk 26; targetSdk 35; versionCode 5; versionName '0.5.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 signingConfigs {
  demo {
   storeFile file(System.getenv('DEMO_KEYSTORE') ?: "${System.properties['user.home']}/.android/debug.keystore")
   storePassword System.getenv('DEMO_STORE_PASSWORD') ?: 'android'
   keyAlias System.getenv('DEMO_KEY_ALIAS') ?: 'androiddebugkey'
   keyPassword System.getenv('DEMO_KEY_PASSWORD') ?: 'android'
  }
 }
 buildTypes { release { signingConfig signingConfigs.demo; minifyEnabled false } }
 sourceSets { main { assets.srcDirs = ['build/generated/assets'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.register('copyWebAssets', Copy) { from '../../dist'; into 'build/generated/assets/www' }
tasks.named('preBuild').configure { dependsOn 'copyWebAssets' }
dependencies {
 implementation 'androidx.webkit:webkit:1.12.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test:rules:1.6.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
